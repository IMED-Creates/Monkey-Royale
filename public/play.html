<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monkey Royale - Battle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="play.css">
</head>
<body>

    <!-- Top Bar -->
    <div class="top-ui">
        <div class="timer" id="match-timer">3:00</div>
        <div class="crowns">
            <span id="player-crowns">0</span>
            <img src="images/crown.png" class="crown-icon">
            <span id="enemy-crowns">0</span>
        </div>
    </div>

    <!-- Arena -->
    <div id="arena">

        <!-- Enemy Towers -->
        <div class="tower enemy-tower left" id="enemy-left-tower"></div>
        <div class="tower enemy-king" id="enemy-king-tower"></div>
        <div class="tower enemy-tower right" id="enemy-right-tower"></div>

        <!-- River -->
        <div class="river"></div>

        <!-- Bridges -->
        <div class="bridge left-bridge"></div>
        <div class="bridge right-bridge"></div>

        <!-- Player Towers -->
        <div class="tower player-tower left" id="player-left-tower"></div>
        <div class="tower player-king" id="player-king-tower"></div>
        <div class="tower player-tower right" id="player-right-tower"></div>

        <!-- Unit Layer -->
        <div id="unit-layer"></div>

        <!-- Drag Preview -->
        <div id="placement-circle"></div>
        <img id="ghost-unit" src="" alt="">
    </div>

    <!-- Bottom UI -->
    <div class="bottom-ui">

        <!-- Elixir Bar -->
        <div class="elixir-bar">
            <div id="elixir-fill"></div>
            <span id="elixir-count">5</span>
        </div>

        <!-- Card Hand -->
        <div id="card-hand"></div>

    </div>

    <script src="play.js"></script>
</body>
</html>
