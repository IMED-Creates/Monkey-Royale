<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Monkey Royale</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #1b1f2a;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #ui {
      padding: 10px;
      background: #111522;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #banana-bar {
      height: 20px;
      width: 200px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    #banana-fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #f7d34a, #f2a93b);
      transition: width 0.1s linear;
    }
    #banana-text {
      font-size: 14px;
    }
    #game {
      flex: 1;
      background: #20263a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
    }
    button {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="banana-bar">
      <div id="banana-fill"></div>
    </div>
    <div id="banana-text">Bananas: 5 / 10</div>
    <button id="spawn-dart">Spawn Dart Monkey (3🍌)</button>
  </div>
  <div id="game">
    <div>Game area (lanes, towers, monkeys) will go here.</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
